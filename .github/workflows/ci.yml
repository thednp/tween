name: CI
on:
  push:
    branches:
      - master
    paths:
      - src
      - test
      - package.json
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - master
    paths:
      - src
      - test
      - package.json
      - .github/workflows/ci.yml
jobs:
  test:
    runs-on: ubuntu-24.04
    name: Test on Node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 26

      # Sets up Vite+, the Node.js runtime, the package manager and the
      # dependency cache; `vp install` runs as part of the setup.
      - name: Vite+ Setup
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
          run-install: '{"args":["--frozen-lockfile"]}'

      - name: Verify Vite+
        run: vp --version

      - name: Lint
        run: vpr lint

      - name: Build
        run: vpr build

      - name: ViTest
        run: vpr test

      # Upload coverage
      - name: Upload coverage report to coveralls.io...
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
