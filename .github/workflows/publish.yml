name: Publish to npm / jsr

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout
      id-token: write # Required for provenance / trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26 # Or 'lts/*'

      # Sets up Vite+, the Node.js runtime, the package manager and the
      # dependency cache; `vp install` runs as part of the setup.
      - name: Vite+ Setup
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 26
          cache: true
          run-install: '{"args":["--frozen-lockfile"]}'

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test
        run: vpr test

      - name: Publish to npm
        run: vp pm publish --provenance --access public --no-git-checks # --access public for new/public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Only needed if NOT using trusted publishing

      - name: Publish to jsr
        run: deno publish
        # env:
        #   Needed only if JSR OIDC (trusted publishing) is not enabled for this repo
        #   JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
